# --- 站点基础元信息：用于 <head> 与页头品牌区 ---
site:
  title: 个人主页
  description: 一名热爱书写与创造的前端工程师，用代码与文字记录生活的温度。
  author: Limbo
  favicon: /favicon.png

# --- 顶部导航菜单：新增页面时在此追加 ---
nav:
