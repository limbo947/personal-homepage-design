# --- 精选项目 ---
projects:
  - title: 项目一
    desc: 一个记录灵感与日常的写作工具，支持离线草稿与多端同步，让书写没有门槛。
    lang: TypeScript
    stars: 1.2k
    year: '2025'
    license: MIT
  - title: 项目二
    desc: 用于个人站点的一键部署脚本，集成构建、发布与回滚，几分钟内完成上线。
    lang: Go
    stars: 860
    year: '2025'
    license: Apache-2.0

# --- 上线网站 ---
sites:
  - icon: feather
    tag: 博客
    title: 站点二
    desc: 记录生活与思考的独立博客，以文字丈量时间。
  - icon: box
    tag: 开源
    title: 站点四
    desc: 开源一些小而美的工具与库，欢迎交流与共建。

# --- 近期文章 ---
articles:
  - icon: file-text
    category: 随笔
    title: 文章一
    desc: 聊聊这一年我如何整理自己的知识体系，以及写作带给我的改变。
    date: '2026-07-21'
  - icon: pen-tool
    category: 技术笔记
    title: 文章二
    desc: 从零开始搭建个人博客的完整记录，包含选型、部署与优化的经验。
    date: '2026-06-12'

# --- 页脚 ---
footer:
  motto: 愿每一次创作，都如晨光般温润而笃定。
  startYear: 2026
  # 部署在国内服务器时按需补充工信部/公安备案信息
  icp: []

# --- 主题配色 ---
# 6 个语义色为一组，50-900 色阶由 theme-derive.js 从 primary 派生
# 修改后通过编辑面板「保存并应用」预览，或「固化」写回此文件
theme:
  light:
    background: '#ffffff' # 暖纸色页面底色
    foreground: '#26221d' # 暖棕黑正文
    card: '#ffffff' # 卡片表面
    border: '#e4ded4' # 描边
    primary: '#198686' # 青绿主色
    accent: '#b0631b' # 暖橙点缀
  dark:
    background: '#000000' # 暖黑底色
    foreground: '#f2eee8' # 暖白正文
    card: '#26221d' # 卡片表面
    border: '#000000' # 描边
    primary: '#4cbfbd' # 提亮青绿
    accent: '#a69c91' # 提亮暖橙
